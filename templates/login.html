<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Manutenção</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
        }

        /* Logo */
        .brand-logo-box {
            width: 100%;
            max-width: 220px;
            height: 105px;
            margin: 0 auto 25px;
            padding: 12px 18px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .10);
        }

        .brand-logo {
            display: block;
            width: 100%;
            max-width: 180px;
            max-height: 80px;
            height: auto;
            object-fit: contain;
        }

        .login-box h1 {
            margin: 0;
            text-align: center;
            color: #111827;
            font-size: 25px;
            font-weight: 700;
        }

        .login-box > p {
            margin: 8px 0 28px;
            text-align: center;
            color: #6b7280;
            font-size: 15px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 46px;
            margin-bottom: 18px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fff;
            color: #111827;
            font-size: 15px;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #1f2937;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #111827;
            transform: translateY(-1px);
        }

        .error {
            margin-bottom: 20px;
            padding: 11px 13px;
            border-radius: 8px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 15px;
            }

            .login-box {
                padding: 25px 20px;
                border-radius: 13px;
            }

            .brand-logo-box {
                max-width: 190px;
                height: 90px;
                padding: 10px 14px;
                margin-bottom: 22px;
            }

            .brand-logo {
                max-width: 155px;
                max-height: 70px;
            }

            .login-box h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="login-box">

        <div class="brand-logo-box">
            <img
                src="/static/logo.png"
                alt="Grupo Alvorada"
                class="brand-logo"
            >
        </div>

        <h1>Sistema de Manutenção</h1>
        <p>Entre com seu usuário</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label>Usuário</label>
            <input type="text" name="username" required>

            <label>Senha</label>
            <input type="password" name="password" required>

            <button type="submit">Entrar</button>
        </form>

    </div>
</div>

</body>
</html>
